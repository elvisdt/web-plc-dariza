server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Puente WebSocket -> broker MQTT local (servicio "mqtt-bridge" en docker-compose).
    # El upstream va en una variable a proposito: asi nginx resuelve el nombre en
    # cada peticion y no se niega a arrancar si el bridge todavia no esta arriba.
    location /mqtt {
        resolver 127.0.0.11 valid=10s;
        set $bridge "mqtt-bridge:9001";
        proxy_pass http://$bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
